spring:
  application:
    name: ofood

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:0bef723f8c5723}
    password: ${MAIL_PASSWORD:8f76c5104df1ce}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  frontend:
    base-url: ${OFOOD_FRONTEND_URL:http://localhost:5173}
  storage:
    type: local
    local:
      root: ${LOCAL_STORAGE_ROOT:/tmp/ofood/uploads}
      max-file-size: 5MB

ofood:
  security:
    cors:
      allowed-origins: ${OFOOD_FRONTEND_URL:http://localhost:5173}
    jwt:
      issuer: ${OFOOD_JWT_ISSUER:http://localhost:8080}
      audience: ${OFOOD_JWT_AUDIENCE:ofood-api}
      access-token-ttl: ${OFOOD_JWT_ACCESS_TOKEN_TTL:10m}
      key-id: ${OFOOD_JWT_KEY_ID:ofood-dev-key}
      private-key-pem: ${OFOOD_JWT_PRIVATE_KEY_PEM:}
      private-key-path: ${OFOOD_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${OFOOD_JWT_PUBLIC_KEY_PATH:}
  auth:
    cookie:
      refresh-token-name: ${OFOOD_REFRESH_TOKEN_NAME:OFOOD_REFRESH_TOKEN}
      max-age: ${OFOOD_REFRESH_TOKEN_MAX_AGE:30d}
      secure: ${OFOOD_REFRESH_TOKEN_SECURE:true}
      http-only: ${OFOOD_REFRESH_TOKEN_HTTP_ONLY:true}
      same-site: ${OFOOD_REFRESH_TOKEN_SAME_SITE:Lax}
    lockout:
      max-failed-attempts: ${OFOOD_AUTH_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${OFOOD_AUTH_LOCK_DURATION:15m}

server:
  port: ${PORT:8080}