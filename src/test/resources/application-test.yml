spring:
  datasource:
    url: jdbc:h2:mem:ofood_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

ofood:
  security:
    jwt:
      issuer: http://localhost:8080
      audience: ofood-api
      key-id: test-kid
      private-key-path: classpath:keys/test_private.pem
  auth:
    cookie:
      secure: false
